## See all available parameters: https://github.com/open-navigation/opennav_docking/tree/main#configuration

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame: substitute_me
    fixed_frame: substitute_me
    dock_prestaging_tolerance: 0.01

    dock_plugins: ["charging_dock"]
    charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.01
      staging_x_offset: substitute_me
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      external_detection_translation_x: substitute_me
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0

    # Dock instances
    docks: ["dock"]
    dock:
      type: "charging_dock"
      frame: dock
      pose: [0.0, 0.0, 0.0]

    controller:
      v_linear_min: 0.05
      v_linear_max: 0.05
      use_collision_detection: false
