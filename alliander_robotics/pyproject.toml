[project]
name = "alliander_robotics"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "mashumaro>=3.17",
    "pyyaml>=6.0.3",
    "termcolor>=3.3.0",
    "xacro>=2.1.1",
]

[dependency-groups]
alliander-franka = [
    "numpy>=2.4.1",
]
alliander-gazebo = [
    "numpy>=2.4.1",
    "pillow>=12.3.0",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
    "scipy>=1.17.0",
    "trimesh>=5.1.0",
    "xmltodict>=1.0.2",
]
alliander-meta = [
    "numpy>=2.4.1",
    "pure-python-adb-reborn>=1.0.0",
    "scipy>=1.17.0",
]
alliander-moveit = [
    "xmltodict>=1.0.2",
]
alliander-nav2 = [
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
]
alliander-robotiq = [
    "numpy>=2.4.1",
    "pyModbusTCP>=0.3.0",
]
alliander-seekthermal = [
    "numpy>=2.4.4",
    "requests>=2.33.0",
]
alliander-ublox = [
    "gpsd>=3.27.5.0.175",
    "pydantic>=2.12.5",
]
alliander-ur = [
    "numpy>=2.4.4",
]
alliander-visualization = [
    "nicegui>=3.12.0",
    "numpy>=2.4.1",
    "simplejpeg>=1.9.0",
    "tornado>=6.5.4",
]
alliander-xsens = [
    "matplotlib>=3.10.9",
    "pydantic>=2.12.5",
    "pyserial>=3.5",
]

# Other dependencies for the tests container to run documentation, linting and pytest:
documentation = [
    "myst-parser>=5.0.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinxcontrib-video>=0.4.2",
]
linting = [
    "actionlint-py>=1.7.12",
    "clang-format>=22.1.5",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "pre-commit>=4.5.1",
    "pydoclint>=0.8.3",
    "reuse>=6.2.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "zizmor>=1.26.1"
]
ros = [
    "catkin-pkg>=1.1.0",
    "lark>=1.3.1",
]
testing = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
]
